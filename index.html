<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <title data-i18n="app.title">MD Viewer</title>
  <link rel="icon" type="image/svg+xml" href="/src/favicon.svg" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <div id="title-group">
        <h1 id="app-title" data-i18n="app.title">MD Viewer</h1>
        <span id="filename"></span>
      </div>
      <div id="toolbar-actions">
        <select id="btn-lang" title="Language"></select>
        <button id="btn-open" data-i18n="toolbar.open" data-i18n-attrs="title">Open</button>
        <button id="btn-theme" data-i18n="toolbar.theme" data-i18n-attrs="title">Theme</button>
      </div>
    </header>

    <main id="content">
      <div id="welcome">
        <div id="welcome-icon">
          <svg width="80" height="80" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/>
            <line x1="16" y1="17" x2="8" y2="17"/>
            <polyline points="10 9 9 9 8 9"/>
          </svg>
        </div>
        <h2 data-i18n="welcome.title">MD Viewer</h2>
        <p><span data-i18n="welcome.drop">Drop a .md file here</span></p>
        <p id="welcome-hint" data-i18n="welcome.hint">or press Ctrl+O to open</p>
      </div>
      <div id="viewer" class="hidden">
        <div id="render-area" class="markdown-body"></div>
      </div>
      <div id="error-overlay" class="hidden">
        <div id="error-box">
          <p id="error-message"></p>
          <button id="btn-error-dismiss" data-i18n="error.dismiss">OK</button>
        </div>
      </div>
    </main>

    <footer id="statusbar">
      <span id="status-text" data-i18n="status.ready">Ready</span>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
