[package]
name = "md-viewer"
version = "1.0.0"
description = "A cross-platform Markdown file viewer"
authors = ["you"]
edition = "2021"

[lib]
name = "md_viewer_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# Updater plugins removed temporarily due to AppLocker build restrictions
# tauri-plugin-updater = "2"
# tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
