<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MD Viewer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <header id="toolbar">
      <div id="title-group">
        <h1 id="app-title">MD Viewer</h1>
        <span id="filename"></span>
      </div>
      <div id="toolbar-actions">
        <button id="btn-open" title="Open file (Ctrl+O)">Open</button>
        <button id="btn-theme" title="Toggle theme">Theme</button>
      </div>
    </header>

    <main id="content">
      <div id="welcome">
        <div id="welcome-icon">
          <img src="/src/favicon.png" alt="" width="80" height="80" />
        </div>
        <h2>MD Viewer</h2>
        <p>Drop a <code>.md</code> file here</p>
        <p id="welcome-hint">or press <kbd>Ctrl+O</kbd> to open</p>
      </div>
      <div id="viewer" class="hidden">
        <div id="render-area" class="markdown-body"></div>
      </div>
      <div id="error-overlay" class="hidden">
        <div id="error-box">
          <p id="error-message"></p>
          <button id="btn-error-dismiss">OK</button>
        </div>
      </div>
    </main>

    <footer id="statusbar">
      <span id="status-text">Ready</span>
    </footer>
  </div>

  <script src="node_modules/highlight.js/lib/core.js"></script>
  <script src="node_modules/highlight.js/lib/languages/javascript.js"></script>
  <script src="node_modules/highlight.js/lib/languages/typescript.js"></script>
  <script src="node_modules/highlight.js/lib/languages/python.js"></script>
  <script src="node_modules/highlight.js/lib/languages/bash.js"></script>
  <script src="node_modules/highlight.js/lib/languages/json.js"></script>
  <script src="node_modules/highlight.js/lib/languages/xml.js"></script>
  <script src="node_modules/highlight.js/lib/languages/css.js"></script>
  <script src="node_modules/highlight.js/lib/languages/sql.js"></script>
  <script src="node_modules/highlight.js/lib/languages/rust.js"></script>
  <script src="node_modules/highlight.js/lib/languages/go.js"></script>
  <script src="node_modules/marked/marked.min.js"></script>
  <script src="renderer.js"></script>
  <script src="main.js"></script>
</body>
</html>
